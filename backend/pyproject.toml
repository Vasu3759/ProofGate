[project]
name = "proofgate-api"
version = "0.1.0"
description = "Evidence-driven brand governance API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.15,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.7,<3.0",
  "pypdf>=5.0,<8.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.9",
  "google-genai>=1.0,<4.0",
  "pyjwt>=2.8,<3.0",
  "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.28,<1.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
